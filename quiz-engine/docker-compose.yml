version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quiz-postgres
    environment:
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizpass123
      POSTGRES_DB: quizdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quiz-network

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: quiz-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongopass123
      MONGO_INITDB_DATABASE: quizdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - quiz-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: quiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quiz-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: quiz-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: TRUE
      ANONYMIZED_TELEMETRY: FALSE
    networks:
      - quiz-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    environment:
      DATABASE_URL: postgresql://quizuser:quizpass123@postgres:5432/quizdb
      MONGODB_URL: mongodb://admin:mongopass123@mongodb:27017/quizdb?authSource=admin
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
      - redis
      - chromadb
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - quiz-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-celery-worker
    environment:
      DATABASE_URL: postgresql://quizuser:quizpass123@postgres:5432/quizdb
      MONGODB_URL: mongodb://admin:mongopass123@mongodb:27017/quizdb?authSource=admin
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
    depends_on:
      - redis
      - postgres
      - mongodb
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - quiz-network
    command: celery -A app.tasks worker --loglevel=info

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-celery-beat
    environment:
      DATABASE_URL: postgresql://quizuser:quizpass123@postgres:5432/quizdb
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    networks:
      - quiz-network
    command: celery -A app.tasks beat --loglevel=info

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - quiz-network
    command: celery -A app.tasks flower --port=5555

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - quiz-network
    command: npm start

  # Nginx (Production)
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./deployment/nginx/sites-enabled:/etc/nginx/sites-enabled
      - ./deployment/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - quiz-network
    profiles:
      - production

networks:
  quiz-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  chromadb_data: